name: W4 ISX1 experimental profile smoke

on:
  pull_request:
    paths:
      - "src/isql_origin/profiles.py"
      - "src/isql_origin/wrapping.py"
      - "tests/test_isx1_experimental_profile.py"
      - "docs/ISX1_EXPERIMENTAL_PROFILE.md"
      - ".github/workflows/w4-isx1-profile-smoke.yml"
  push:
    branches:
      - "agent/meta-core-w4-isx1-profile"

jobs:
  w4-isx1-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source package
        run: python -m pip install -e .
      - name: Compile source
        run: python -m compileall -q src
      - name: Run W4 experimental profile tests
        run: python -m unittest discover -s tests -p 'test_isx1_experimental_profile.py' -v
