[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isql-origin-runtime"
version = "0.7.0"
description = "ISQL Origin OMIR P6 independent Go implementation and conformance"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Neo.K / EveMissLab"}]
dependencies = []

[project.scripts]
isql-origin = "isql_origin.p5_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
