[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isql-origin-runtime"
version = "0.5.0"
description = "ISQL Origin OMIR-1 / ORB-1 P4 cross-profile bridge receipts and preserved/lost invariant accounting"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Neo.K / EveMissLab"}]
dependencies = []

[project.scripts]
isql-origin = "isql_origin.p4_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
